name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # manual trigger button in GitHub Actions UI

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          modules: 'qtmultimedia qtspeech'

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Create vcpkg binary cache directory
        run: New-Item -ItemType Directory -Force -Path C:\vcpkg-cache

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-gmp

      - name: Install GMP via vcpkg
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
        run: vcpkg install gmp:x64-windows

      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      # CPack produces both NSIS installer and ZIP.
      # qt_generate_deploy_app_script() in CMakeLists.txt runs windeployqt at install
      # time, so CPack sees all Qt DLLs and plugins — both packages are fully functional.
      - name: Run CPack
        working-directory: build
        run: cpack -C Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: build/QMentat-*.*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/QMentat-*.*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libspeechd-dev rpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          modules: 'qtmultimedia qtspeech'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # Produces .deb, .rpm, and .tar.gz — all from install() rules which is correct
      # for Linux (shared Qt libs are system dependencies, not bundled).
      - name: Run CPack
        working-directory: build
        run: cpack

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: build/QMentat-*.*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/QMentat-*.*
